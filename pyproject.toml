[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-warrior"
version = "1.0.0"
description = "Game written in Python for learning Python and artificial intelligence (port of Ruby Warrior) with a 2D graphical view."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["pygame-ce>=2.4"]
dev = ["pytest>=7", "pygame-ce>=2.4"]

[project.scripts]
pywarrior = "python_warrior.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
python_warrior = ["towers/*/*.py", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
